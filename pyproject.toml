[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ec4-liveprofessor-bridge"
version = "0.5.0"
description = "Pont MIDI/SysEx Faderfox EC4 vers OSC LiveProfessor"
requires-python = ">=3.11"
dependencies = [
  "mido==1.3.3",
  "python-rtmidi==1.5.8",
]

[project.scripts]
ec4-liveprofessor = "ec4lpbridge.app:main"

[tool.setuptools.packages.find]
where = ["src"]

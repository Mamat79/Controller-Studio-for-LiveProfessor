[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "silemio-control-hub"
version = "2026.3"
description = "Controller Studio for LiveProfessor by SiLeMI/O"
requires-python = ">=3.11"
dependencies = [
  "mido==1.3.3",
  "python-rtmidi==1.5.8",
]

[project.scripts]
silemio-control-hub = "silemio_control_hub.cli:main"

[project.gui-scripts]
silemio-control-hub-gui = "silemio_control_hub.desktop:main"
silemio-controller-studio = "silemio_control_hub.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["silemio_control_hub*"]

[tool.setuptools.package-data]
silemio_control_hub = [
  "assets/*.ico",
  "assets/*.png",
  "controller_profiles/*.json",
  "manuals/*.pdf",
  "resources/*.ctrl2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
